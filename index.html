<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mannaNAUTA Blocos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/blockly@11.2.2/blockly_compressed.js"></script>
<script src="https://unpkg.com/blockly@11.2.2/blocks_compressed.js"></script>
<script src="https://unpkg.com/blockly@11.2.2/msg/pt-br.js"></script>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<header>
  <div class="marca"><img src="img/logo-manna-team.png" alt="manna team"><span class="produto">NAUTA Blocos</span></div>
  <button id="btNovo" title="Começar um programa novo">Novo</button>
  <label class="botao" title="Abrir um projeto salvo">Abrir<input id="arquivo" type="file" accept=".json,.manna" hidden></label>
  <button id="btSalvar" title="Baixar o projeto">Salvar</button>
  <span class="espaco"></span>
  <span id="status">Pronto</span>
  <button id="btInstalar" title="Só na primeira vez: deixa a placa pronta para receber programas">Preparar placa</button>
  <button id="btConectar">Conectar placa</button>
  <button id="btParar" title="Para o programa que está rodando">Parar</button>
  <button id="btEnviar" class="principal">Enviar para a placa</button>
</header>
<div class="pontos" aria-hidden="true"></div>
<div id="progresso"><div></div></div>
<div id="aviso"></div>
<main>
  <div id="areaBlocos"></div>
  <aside>
    <div class="abas">
      <button data-aba="codigo" class="ativa">Código Python</button>
      <button data-aba="monitor">Monitor serial</button>
    </div>
    <div id="painel-codigo" class="painel ativo"><pre id="codigo"></pre></div>
    <div id="painel-monitor" class="painel"><pre id="monitor"></pre></div>
    <div class="barraPainel">
      <button id="btCopiar">Copiar código</button>
      <button id="btLimparMonitor">Limpar monitor</button>
    </div>
  </aside>
</main>

<dialog id="dlgInstalar">
  <h2>Preparar a placa</h2>
  <p id="txtInstalar">Faça isso só se a placa for nova ou parar de responder. Tudo o que estiver gravado nela será apagado.</p>
  <p>Se não começar, segure o botão <b>BOOT</b>, aperte e solte <b>RESET</b>, solte o <b>BOOT</b> e tente de novo.</p>
  <div class="acoes"><button id="btCancelarInst">Cancelar</button><button id="btConfirmarInst" class="principal">Preparar agora</button></div>
</dialog>

<script src="js/blocos.js"></script>
<script src="js/gerador.js"></script>
<script src="js/caixa.js"></script>
<script src="js/interface.js"></script>
<script src="js/placa.js"></script>
<script src="js/preparar.js"></script>
</body>
</html>
