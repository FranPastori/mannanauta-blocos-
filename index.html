<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mannaNAUTA Blocos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/blockly@11.2.2/blockly_compressed.js"></script>
<script src="https://unpkg.com/blockly@11.2.2/blocks_compressed.js"></script>
<script src="https://unpkg.com/blockly@11.2.2/msg/pt-br.js"></script>
<style>
  /* Identidade visual manna team */
  :root {
    --preto:#000000; --ciano:#1CD3F7; --laranja:#FFA300; --rosa:#EF466E; --verde:#44AF69;
    --azul:#1589C6; --azul-escuro:#076CA9; --azul-claro:#CCE2F7;
    --fundo:#F5F9FD; --borda:#DCE7F2; --texto:#111418;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; font-family:'Nunito', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--texto); }
  body { display:flex; flex-direction:column; background:#fff; }
  header { display:flex; align-items:center; gap:8px; padding:10px 14px 8px; background:#fff; flex-wrap:wrap; }
  .marca { display:flex; align-items:center; gap:10px; margin-right:10px; }
  .marca img { height:26px; width:auto; display:block; }
  .marca .produto { font-weight:900; font-size:15px; padding:3px 10px 4px; border-radius:999px; background:var(--preto); color:#fff; letter-spacing:.2px; }
  .pontos { height:10px; margin:0 14px 2px; background:
      radial-gradient(circle at 5px 5px, var(--cor-ponto, #1589C6) 4px, transparent 4.6px) 0 0 / 16px 10px repeat-x;
      -webkit-mask: linear-gradient(90deg, #000, #000); position:relative; }
  .pontos::before { content:""; position:absolute; inset:0;
      background:linear-gradient(90deg, #CCE2F7, #72BCE4 30%, #1B98D4 60%, #076CA9);
      -webkit-mask: radial-gradient(circle at 5px 5px, #000 4px, transparent 4.6px) 0 0 / 16px 10px repeat-x;
              mask: radial-gradient(circle at 5px 5px, #000 4px, transparent 4.6px) 0 0 / 16px 10px repeat-x; }
  .pontos { background:none; }
  button, .botao { font:inherit; font-size:14px; font-weight:800; border:2px solid var(--borda); border-radius:999px; padding:6px 14px; cursor:pointer; background:#fff; color:var(--texto); }
  button:hover, .botao:hover { border-color:var(--azul); color:var(--azul-escuro); }
  button.principal { background:var(--azul); border-color:var(--azul); color:#fff; }
  button.principal:hover { background:var(--azul-escuro); border-color:var(--azul-escuro); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  #btConfig { padding:6px 10px; }
  .espaco { flex:1; }
  #status { font-size:13px; font-weight:700; color:#5b6672; }
  main { flex:1; display:flex; min-height:0; border-top:1px solid var(--borda); }
  #areaBlocos { flex:1; min-width:0; }
  aside { width:36%; min-width:260px; max-width:560px; display:flex; flex-direction:column; border-left:1px solid var(--borda); background:var(--fundo); }
  .abas { display:flex; border-bottom:1px solid var(--borda); background:#fff; }
  .abas button { flex:1; border:0; border-radius:0; padding:10px; background:transparent; color:#5b6672; }
  .abas button:hover { color:var(--texto); }
  .abas button.ativa { color:var(--texto); box-shadow: inset 0 -3px 0 var(--rosa); }
  .painel { flex:1; overflow:auto; display:none; }
  .painel.ativo { display:block; }
  pre { margin:0; padding:12px; font-size:12.5px; line-height:1.45; white-space:pre; font-family: ui-monospace, Menlo, Consolas, monospace; }
  #monitor { background:#0b1118; color:#7fe3a4; min-height:100%; }
  .barraPainel { display:flex; gap:6px; padding:8px; border-top:1px solid var(--borda); background:#fff; flex-wrap:wrap; }
  .barraPainel button { font-size:13px; padding:5px 12px; }
  #aviso { display:none; background:#FFF6E0; color:#6b4500; padding:8px 14px; font-size:13px; font-weight:700; border-top:1px solid #FFE1A3; }
  #progresso { height:4px; background:transparent; }
  #progresso div { height:100%; width:0; background:linear-gradient(90deg, var(--ciano), var(--azul)); transition:width .2s; }
  dialog { border:0; border-radius:16px; padding:20px; max-width:420px; font-family:inherit; }
  dialog h2 { margin-top:0; font-size:19px; font-weight:900; }
  dialog input { width:100%; padding:9px 12px; font:inherit; font-size:14px; border:2px solid var(--borda); border-radius:10px; }
  dialog input:focus { outline:none; border-color:var(--azul); }
  dialog .acoes { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  /* Caixa de categorias do Blockly */
  .blocklyToolboxDiv, .blocklyToolbox { background:var(--fundo) !important; font-family:'Nunito', sans-serif !important; }
  .blocklyTreeLabel { font-family:'Nunito', sans-serif !important; font-weight:800; font-size:14px !important; }
  .blocklyTreeRow { border-radius:0 999px 999px 0; margin-right:6px; height:32px !important; line-height:32px !important; }
  header button { white-space:nowrap; }
  @media (max-width: 760px) { main { flex-direction:column; } aside { width:100%; max-width:none; height:38%; border-left:0; border-top:1px solid var(--borda); } .marca .produto { display:none; } }
</style>
</head>

  <p style="font-size:14px">Se a instalação não começar, segure o botão <b>BOOT</b>, aperte e solte <b>RESET</b>, solte o <b>BOOT</b> e tente de novo.</p>
  <div class="acoes"><button id="btCancelarInst">Cancelar</button><button id="btConfirmarInst" class="principal">Instalar agora</button></div>

<script>
/* =====================================================================
   mannaNAUTA Blocos — editor de blocos para a placa mannaNAUTA (ESP32-S3)
   Os blocos geram MicroPython. A biblioteca micropython/mannanauta.py é a
   versão em Python das bibliotecas livres de wuigor:
     mannaNAUTA_WS2812_Lib  (matriz 5x5 de LEDs, pino 47)
     mannaNAUTA_LSM6DS_Lib  (acelerômetro/giroscópio, SDA 5 / SCL 4)
   ===================================================================== */


const armazenar = {
  ler(k, padrao) { try { const v = localStorage.getItem(k); return v === null ? padrao : v; } catch (e) { return padrao; } },
  gravar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

/* ---------------------------- Cores ---------------------------------- */
const COR = { evento:'#FFBF00', controle:'#FFAB19', matriz:'#9966FF', cor:'#CF63CF', sensor:'#4CBF56', serial:'#0FBD8C', matematica:'#59C059', logica:'#5CB1D6', variavel:'#FF8C1A' };

const CORES_NOMEADAS = [
  ['🔴 vermelho', '0xFF0000'], ['🟢 verde', '0x00FF00'], ['🔵 azul', '0x0000FF'],
  ['🟡 amarelo', '0xFFFF00'], ['🟠 laranja', '0xFF8000'], ['🟣 roxo', '0x8000FF'],
  ['🩷 rosa', '0xFF3080'], ['🩵 ciano', '0x00FFFF'], ['⚪ branco', '0xFFFFFF'], ['⚫ apagado', '0x000000']
];

/* ---------------------------- Blocos --------------------------------- */
const sombraCor = { shadow: { type: 'mn_cor', fields: { COR: '0x00FF00' } } };
const sombraNum = (n) => ({ shadow: { type: 'math_number', fields: { NUM: n } } });

Blockly.defineBlocksWithJsonArray([
  // Eventos
  { type:'mn_ao_ligar', message0:'quando a placa ligar %1 %2', args0:[{type:'input_dummy'},{type:'input_statement',name:'CORPO'}], colour:COR.evento, tooltip:'Roda uma vez, quando a placa liga.' },
  { type:'mn_sempre', message0:'repetir para sempre %1 %2', args0:[{type:'input_dummy'},{type:'input_statement',name:'CORPO'}], colour:COR.evento, tooltip:'Roda sem parar, depois do "quando a placa ligar".' },

  // Controle
  { type:'mn_esperar', message0:'esperar %1 segundos', args0:[{type:'input_value',name:'S',check:'Number'}], previousStatement:null, nextStatement:null, colour:COR.controle, inputsInline:true },
  { type:'mn_esperar_ms', message0:'esperar %1 milissegundos', args0:[{type:'input_value',name:'MS',check:'Number'}], previousStatement:null, nextStatement:null, colour:COR.controle, inputsInline:true },
  { type:'mn_tempo', message0:'tempo desde que ligou (ms)', output:'Number', colour:COR.controle },

  // Matriz de LEDs
  { type:'mn_brilho', message0:'brilho da matriz %1 %%', args0:[{type:'input_value',name:'B',check:'Number'}], previousStatement:null, nextStatement:null, colour:COR.matriz, inputsInline:true, tooltip:'De 0 a 100. Vale para o que for desenhado depois.' },
  { type:'mn_limpar', message0:'apagar a matriz', previousStatement:null, nextStatement:null, colour:COR.matriz },
  { type:'mn_todos', message0:'acender todos os LEDs com %1', args0:[{type:'input_value',name:'COR',check:'Cor'}], previousStatement:null, nextStatement:null, colour:COR.matriz, inputsInline:true },
  { type:'mn_led_xy', message0:'acender LED coluna %1 linha %2 com %3', args0:[{type:'input_value',name:'X',check:'Number'},{type:'input_value',name:'Y',check:'Number'},{type:'input_value',name:'COR',check:'Cor'}], previousStatement:null, nextStatement:null, colour:COR.matriz, inputsInline:true, tooltip:'Coluna e linha de 1 a 5. A linha 1 fica em cima.' },
  { type:'mn_led_n', message0:'acender LED número %1 com %2', args0:[{type:'input_value',name:'N',check:'Number'},{type:'input_value',name:'COR',check:'Cor'}], previousStatement:null, nextStatement:null, colour:COR.matriz, inputsInline:true, tooltip:'LEDs numerados de 1 a 25.' },
  { type:'mn_letra', message0:'mostrar letra %1 com %2', args0:[{type:'field_input',name:'L',text:'A'},{type:'input_value',name:'COR',check:'Cor'}], previousStatement:null, nextStatement:null, colour:COR.matriz, inputsInline:true, tooltip:'Uma letra de A a Z.' },
  { type:'mn_numero', message0:'mostrar número %1 com %2', args0:[{type:'input_value',name:'N',check:'Number'},{type:'input_value',name:'COR',check:'Cor'}], previousStatement:null, nextStatement:null, colour:COR.matriz, inputsInline:true, tooltip:'Um algarismo de 0 a 9.' },
  { type:'mn_texto', message0:'mostrar texto %1 com %2 cada letra por %3 segundos', args0:[{type:'field_input',name:'T',text:'MANNA'},{type:'input_value',name:'COR',check:'Cor'},{type:'input_value',name:'S',check:'Number'}], previousStatement:null, nextStatement:null, colour:COR.matriz, inputsInline:true, tooltip:'Mostra letras (A–Z) e algarismos (0–9), um de cada vez.' },
  { type:'mn_simbolo', message0:'mostrar símbolo %1 com %2', args0:[{type:'field_dropdown',name:'S',options:[['?','?'],['!','!'],['#','#'],['@','@'],['$','$'],['%','%'],['(','('],[')',')'],['[','['],[']',']']]},{type:'input_value',name:'COR',check:'Cor'}], previousStatement:null, nextStatement:null, colour:COR.matriz, inputsInline:true },
  { type:'mn_preparar_xy', message0:'preparar LED coluna %1 linha %2 com %3', args0:[{type:'input_value',name:'X',check:'Number'},{type:'input_value',name:'Y',check:'Number'},{type:'input_value',name:'COR',check:'Cor'}], previousStatement:null, nextStatement:null, colour:COR.matriz, inputsInline:true, tooltip:'Prepara o LED sem acender. Use "mostrar LEDs preparados" para acender tudo de uma vez.' },
  { type:'mn_preparar_n', message0:'preparar LED número %1 com %2', args0:[{type:'input_value',name:'N',check:'Number'},{type:'input_value',name:'COR',check:'Cor'}], previousStatement:null, nextStatement:null, colour:COR.matriz, inputsInline:true, tooltip:'Prepara o LED (1 a 25) sem acender.' },
  { type:'mn_preparar_limpar', message0:'apagar LEDs preparados', previousStatement:null, nextStatement:null, colour:COR.matriz, tooltip:'Apaga a preparação, sem mudar o que está aceso agora.' },
  { type:'mn_mostrar', message0:'mostrar LEDs preparados', previousStatement:null, nextStatement:null, colour:COR.matriz, tooltip:'Acende de uma vez todos os LEDs preparados.' },
  { type:'mn_emocao', message0:'mostrar carinha %1 com %2', args0:[{type:'field_dropdown',name:'E',options:[['feliz =]','=]'],['triste =[','=['],['surpresa =O','=O'],['boca aberta =o','=o'],['confusa =s','=s'],['muito confusa =S','=S']]},{type:'input_value',name:'COR',check:'Cor'}], previousStatement:null, nextStatement:null, colour:COR.matriz, inputsInline:true },

  // Cores
  { type:'mn_cor', message0:'%1', args0:[{type:'field_dropdown',name:'COR',options:CORES_NOMEADAS}], output:'Cor', colour:COR.cor },
  { type:'mn_cor_rgb', message0:'cor vermelho %1 verde %2 azul %3', args0:[{type:'input_value',name:'R',check:'Number'},{type:'input_value',name:'G',check:'Number'},{type:'input_value',name:'B',check:'Number'}], output:'Cor', colour:COR.cor, inputsInline:true, tooltip:'Cada parte vai de 0 a 255.' },
  { type:'mn_cor_hsv', message0:'cor matiz %1 saturação %2 %% brilho %3 %%', args0:[{type:'input_value',name:'H',check:'Number'},{type:'input_value',name:'S',check:'Number'},{type:'input_value',name:'V',check:'Number'}], output:'Cor', colour:COR.cor, inputsInline:true, tooltip:'Matiz de 0 a 360 (volta no círculo das cores); saturação e brilho de 0 a 100.' },
  { type:'mn_cor_arco', message0:'cor do arco-íris na posição %1', args0:[{type:'input_value',name:'P',check:'Number'}], output:'Cor', colour:COR.cor, inputsInline:true, tooltip:'Posição de 0 a 255: percorre todas as cores.' },

  // Sensor de movimento
  { type:'mn_aceleracao', message0:'aceleração no eixo %1 (g)', args0:[{type:'field_dropdown',name:'EIXO',options:[['X','x'],['Y','y'],['Z','z']]}], output:'Number', colour:COR.sensor, tooltip:'Parada e deitada, a placa marca cerca de 1 g no eixo Z.' },
  { type:'mn_giro', message0:'giro no eixo %1 (graus/s)', args0:[{type:'field_dropdown',name:'EIXO',options:[['X','x'],['Y','y'],['Z','z']]}], output:'Number', colour:COR.sensor },
  { type:'mn_angulo', message0:'inclinação %1 em graus', args0:[{type:'field_dropdown',name:'TIPO',options:[['para os lados','rol'],['para frente e para trás','arf']]}], output:'Number', colour:COR.sensor },
  { type:'mn_inclinada', message0:'placa inclinada %1 ?', args0:[{type:'field_dropdown',name:'DIR',options:[['para frente','1'],['para trás','2'],['para a direita','3'],['para a esquerda','4'],['nivelada (reta)','0']]}], output:'Boolean', colour:COR.sensor },
  { type:'mn_sacudida', message0:'placa sacudida?', output:'Boolean', colour:COR.sensor },
  { type:'mn_sensibilidade', message0:'sensibilidade da sacudida %1', args0:[{type:'field_dropdown',name:'NIVEL',options:[['média','20'],['alta (sacudida leve)','8'],['baixa (sacudida forte)','40']]}], previousStatement:null, nextStatement:null, colour:COR.sensor },
  { type:'mn_faixa_acel', message0:'faixa do acelerômetro %1', args0:[{type:'field_dropdown',name:'F',options:[['±2 g','2'],['±4 g','4'],['±8 g','8'],['±16 g','16']]}], previousStatement:null, nextStatement:null, colour:COR.sensor, tooltip:'Faixas maiores medem movimentos mais fortes, com menos detalhe.' },
  { type:'mn_faixa_giro', message0:'faixa do giroscópio %1', args0:[{type:'field_dropdown',name:'F',options:[['±250 graus/s','250'],['±125 graus/s','125'],['±500 graus/s','500'],['±1000 graus/s','1000'],['±2000 graus/s','2000']]}], previousStatement:null, nextStatement:null, colour:COR.sensor },
  { type:'mn_conectado', message0:'sensor conectado?', output:'Boolean', colour:COR.sensor },
  { type:'mn_nome_sensor', message0:'nome do sensor', output:'String', colour:COR.sensor, tooltip:'Bom para escrever no monitor e conferir a placa.' },
  { type:'mn_temperatura', message0:'temperatura (°C)', output:'Number', colour:COR.sensor },
  { type:'mn_passos', message0:'número de passos', output:'Number', colour:COR.sensor, tooltip:'Conta passos quando a placa vai junto com quem anda.' },
  { type:'mn_zerar_passos', message0:'zerar contador de passos', previousStatement:null, nextStatement:null, colour:COR.sensor },

  // Monitor serial
  { type:'mn_escrever', message0:'escrever no monitor %1', args0:[{type:'input_value',name:'V'}], previousStatement:null, nextStatement:null, colour:COR.serial, inputsInline:true },
  { type:'mn_escrever_dois', message0:'escrever no monitor %1 %2', args0:[{type:'input_value',name:'A'},{type:'input_value',name:'B'}], previousStatement:null, nextStatement:null, colour:COR.serial, inputsInline:true, tooltip:'Escreve duas coisas na mesma linha, por exemplo um nome e um valor.' }
]);

// Bloco de desenho: grade 5x5 de caixinhas.
Blockly.Blocks['mn_desenho'] = {
  init() {
    this.appendDummyInput().appendField('desenhar com');
    this.appendValueInput('COR').setCheck('Cor');
    for (let y = 0; y < 5; y++) {
      const linha = this.appendDummyInput();
      for (let x = 0; x < 5; x++) linha.appendField(new Blockly.FieldCheckbox(false), `P${y * 5 + x}`);
    }
    this.setInputsInline(false);
    this.setPreviousStatement(true); this.setNextStatement(true);
    this.setColour(COR.matriz);
    this.setTooltip('Marque os LEDs que devem acender.');
  }
};

// Os blocos padrão do Blockly ganham a cor da categoria em que aparecem.
const RECOLORIR = {
  controle: ['controls_if', 'controls_repeat_ext', 'controls_whileUntil', 'controls_for', 'controls_flow_statements'],
  matematica: ['math_number', 'math_arithmetic', 'math_random_int', 'math_modulo', 'math_round', 'math_single',
               'logic_compare', 'logic_operation', 'logic_negate', 'logic_boolean'],
  serial: ['text'],
  variavel: ['variables_get', 'variables_set', 'math_change']
};
for (const [categoria, tipos] of Object.entries(RECOLORIR)) {
  for (const tipo of tipos) {
    const def = Blockly.Blocks[tipo];
    if (!def || def.__recolorido) continue;
    const initOriginal = def.init;
    def.init = function () { initOriginal.call(this); this.setColour(COR[categoria]); };
    def.__recolorido = true;
  }
}

/* ---------------------- Gerador de MicroPython ----------------------- */
const Py = new Blockly.CodeGenerator('MicroPython');
Py.ORDER_ATOMIC = 0; Py.ORDER_EXP = 3; Py.ORDER_UNARY = 4; Py.ORDER_MULT = 5; Py.ORDER_ADD = 6;
Py.ORDER_REL = 11; Py.ORDER_NOT = 12; Py.ORDER_AND = 13; Py.ORDER_OR = 14; Py.ORDER_NONE = 99;
Py.INDENT = '    ';
Py.addReservedWords('False,None,True,and,as,assert,break,class,continue,def,del,elif,else,except,finally,for,from,global,if,import,in,is,lambda,nonlocal,not,or,pass,raise,return,try,while,with,yield,' +
  'time,math,random,print,int,float,str,range,abs,round,matriz,sensor,Matriz,Sensor,contar,cor_rgb,cor_arco,cor_hsv,mannanauta');

Py.init = function (ws) {
  Object.getPrototypeOf(this).init.call(this, ws);
  this.usa = new Set();
  if (!this.nameDB_) this.nameDB_ = new Blockly.Names(this.RESERVED_WORDS_);
  else this.nameDB_.reset();
  this.nameDB_.setVariableMap(ws.getVariableMap());
  this.nameDB_.populateVariables(ws);
  // Nomes de variável legíveis: "posição" vira "posicao"
  this.nomesVar = new Map();
  const usados = new Set(this.RESERVED_WORDS_.split(','));
  for (const va of ws.getVariableMap().getAllVariables()) {
    let n = va.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9_]+/g, '_').replace(/^_+|_+$/g, '');
    if (!n) n = 'variavel';
    if (/^[0-9]/.test(n)) n = 'v_' + n;
    let final = n, k = 2;
    while (usados.has(final)) final = n + '_' + k++;
    usados.add(final);
    this.nomesVar.set(va.getId(), final);
  }
};
Py.scrub_ = function (block, code, thisOnly) {
  const prox = block.nextConnection && block.nextConnection.targetBlock();
  return code + (prox && !thisOnly ? this.blockToCode(prox) : '');
};
Py.scrubNakedValue = (line) => line + '\n';
Py.nomeVar = function (id) { return this.nomesVar.get(id) || this.nameDB_.getName(id, Blockly.Names.NameType.VARIABLE); };
Py.corpo = function (b, nome) { return this.statementToCode(b, nome) || this.INDENT + 'pass\n'; };
const v = (b, nome, ordem, padrao = '0') => Py.valueToCode(b, nome, ordem ?? Py.ORDER_NONE) || padrao;
const usaMatriz = () => Py.usa.add('matriz');
const cor = (b) => { usaMatriz(); return v(b, 'COR', Py.ORDER_NONE, '0x00FF00'); };
const f = Py.forBlock;

// Blocos padrão do Blockly
f['math_number'] = (b) => { const n = Number(b.getFieldValue('NUM')); return [String(n), n < 0 ? Py.ORDER_UNARY : Py.ORDER_ATOMIC]; };
f['math_arithmetic'] = (b) => {
  const op = b.getFieldValue('OP');
  const t = { ADD:['+', Py.ORDER_ADD], MINUS:['-', Py.ORDER_ADD], MULTIPLY:['*', Py.ORDER_MULT], DIVIDE:['/', Py.ORDER_MULT], POWER:['**', Py.ORDER_EXP] }[op];
  return [`${v(b,'A',t[1])} ${t[0]} ${v(b,'B',t[1])}`, t[1]];
};
f['math_modulo'] = (b) => [`${v(b,'DIVIDEND',Py.ORDER_MULT)} % ${v(b,'DIVISOR',Py.ORDER_MULT,'1')}`, Py.ORDER_MULT];
f['math_random_int'] = (b) => { Py.usa.add('random'); return [`random.randint(int(${v(b,'FROM')}), int(${v(b,'TO')}))`, Py.ORDER_ATOMIC]; };
f['math_round'] = (b) => {
  const op = b.getFieldValue('OP'), x = v(b, 'NUM');
  if (op === 'ROUND') return [`round(${x})`, Py.ORDER_ATOMIC];
  Py.usa.add('math');
  return [`math.${op === 'ROUNDUP' ? 'ceil' : 'floor'}(${x})`, Py.ORDER_ATOMIC];
};
f['math_single'] = (b) => {
  const op = b.getFieldValue('OP'), x = v(b, 'NUM');
  if (op === 'ABS') return [`abs(${x})`, Py.ORDER_ATOMIC];
  if (op === 'NEG') return [`-(${x})`, Py.ORDER_UNARY];
  if (op === 'POW10') return [`10 ** (${x})`, Py.ORDER_EXP];
  Py.usa.add('math');
  const t = { ROOT:`math.sqrt(${x})`, LN:`math.log(${x})`, LOG10:`(math.log(${x}) / math.log(10))`, EXP:`math.exp(${x})` };
  return [t[op] || x, Py.ORDER_ATOMIC];
};
f['logic_boolean'] = (b) => [b.getFieldValue('BOOL') === 'TRUE' ? 'True' : 'False', Py.ORDER_ATOMIC];
f['logic_negate'] = (b) => [`not ${v(b,'BOOL',Py.ORDER_NOT,'False')}`, Py.ORDER_NOT];
f['logic_operation'] = (b) => {
  const e = b.getFieldValue('OP') === 'AND', o = e ? Py.ORDER_AND : Py.ORDER_OR;
  return [`${v(b,'A',o,'False')} ${e ? 'and' : 'or'} ${v(b,'B',o,'False')}`, o];
};
f['logic_compare'] = (b) => {
  const op = { EQ:'==', NEQ:'!=', LT:'<', LTE:'<=', GT:'>', GTE:'>=' }[b.getFieldValue('OP')];
  return [`${v(b,'A',Py.ORDER_REL)} ${op} ${v(b,'B',Py.ORDER_REL)}`, Py.ORDER_REL];
};
f['controls_if'] = (b) => {
  let code = '';
  for (let i = 0; b.getInput('IF' + i); i++) {
    code += (i ? 'elif ' : 'if ') + v(b, 'IF' + i, Py.ORDER_NONE, 'False') + ':\n' + Py.corpo(b, 'DO' + i);
  }
  if (b.getInput('ELSE')) code += 'else:\n' + Py.corpo(b, 'ELSE');
  return code;
};
f['controls_repeat_ext'] = (b) => {
  const i = Py.nameDB_.getDistinctName('_i', Blockly.Names.NameType.VARIABLE);
  return `for ${i} in range(int(${v(b,'TIMES')})):\n${Py.corpo(b,'DO')}`;
};
f['controls_whileUntil'] = (b) => {
  let c = v(b, 'BOOL', Py.ORDER_NONE, 'False');
  if (b.getFieldValue('MODE') === 'UNTIL') c = `not (${c})`;
  return `while ${c}:\n${Py.corpo(b,'DO')}`;
};
f['controls_for'] = (b) => {
  const n = Py.nomeVar(b.getFieldValue('VAR'));
  return `for ${n} in contar(${v(b,'FROM')}, ${v(b,'TO')}, ${v(b,'BY',Py.ORDER_NONE,'1')}):\n${Py.corpo(b,'DO')}`;
};
f['controls_flow_statements'] = (b) => {
  const lacos = ['controls_repeat_ext', 'controls_whileUntil', 'controls_for'];
  let pai = b.getSurroundParent();
  while (pai && !lacos.includes(pai.type)) pai = pai.getSurroundParent();
  if (!pai) return '# (bloco "sair do laço" fora de um laço foi ignorado)\n';
  return b.getFieldValue('FLOW') === 'BREAK' ? 'break\n' : 'continue\n';
};
f['variables_get'] = (b) => [Py.nomeVar(b.getFieldValue('VAR')), Py.ORDER_ATOMIC];
f['variables_set'] = (b) => `${Py.nomeVar(b.getFieldValue('VAR'))} = ${v(b,'VALUE')}\n`;
f['math_change'] = (b) => `${Py.nomeVar(b.getFieldValue('VAR'))} += ${v(b,'DELTA')}\n`;
f['text'] = (b) => [JSON.stringify(b.getFieldValue('TEXT')), Py.ORDER_ATOMIC];

// Eventos e controle
f['mn_ao_ligar'] = () => ''; f['mn_sempre'] = () => '';
f['mn_esperar'] = (b) => `time.sleep(${v(b,'S')})\n`;
f['mn_esperar_ms'] = (b) => `time.sleep_ms(int(${v(b,'MS')}))\n`;
f['mn_tempo'] = () => ['time.ticks_ms()', Py.ORDER_ATOMIC];

// Matriz
f['mn_brilho'] = (b) => { usaMatriz(); return `matriz.brilho(${v(b,'B')})\n`; };
f['mn_limpar'] = () => { usaMatriz(); return 'matriz.limpar()\n'; };
f['mn_todos'] = (b) => `matriz.todos(${cor(b)})\n`;
f['mn_led_xy'] = (b) => { const c = cor(b); return `matriz.led_xy(${v(b,'X')}, ${v(b,'Y')}, ${c})\n`; };
f['mn_led_n'] = (b) => { const c = cor(b); return `matriz.led(int(${v(b,'N')}) - 1, ${c})\n`; };
f['mn_preparar_xy'] = (b) => { const c = cor(b); return `matriz.preparar_xy(${v(b,'X')}, ${v(b,'Y')}, ${c})\n`; };
f['mn_preparar_n'] = (b) => { const c = cor(b); return `matriz.preparar(int(${v(b,'N')}) - 1, ${c})\n`; };
f['mn_preparar_limpar'] = () => { usaMatriz(); return 'matriz.preparar_todos(0)\n'; };
f['mn_mostrar'] = () => { usaMatriz(); return 'matriz.mostrar()\n'; };
f['mn_letra'] = (b) => {
  const c = cor(b);
  let l = (b.getFieldValue('L') || 'A').trim().toUpperCase().charAt(0);
  if (!/[A-Z]/.test(l)) l = 'A';
  return `matriz.letra("${l}", ${c})\n`;
};
f['mn_numero'] = (b) => { const c = cor(b); return `matriz.numero(${v(b,'N')}, ${c})\n`; };
f['mn_texto'] = (b) => { const c = cor(b); return `matriz.texto(${JSON.stringify(b.getFieldValue('T') || '')}, ${c}, ${v(b,'S',Py.ORDER_NONE,'0.5')})\n`; };
f['mn_simbolo'] = (b) => { const c = cor(b); return `matriz.simbolo(${JSON.stringify(b.getFieldValue('S'))}, ${c})\n`; };
f['mn_emocao'] = (b) => { const c = cor(b); return `matriz.emocao("${b.getFieldValue('E')}", ${c})\n`; };
f['mn_desenho'] = (b) => {
  const c = cor(b);
  let bits = '';
  for (let i = 0; i < 25; i++) bits += b.getFieldValue('P' + i) === 'TRUE' ? '1' : '0';
  return `matriz.desenho("${bits}", ${c})\n`;
};

// Cores
f['mn_cor'] = (b) => [b.getFieldValue('COR'), Py.ORDER_ATOMIC];
f['mn_cor_rgb'] = (b) => [`cor_rgb(${v(b,'R')}, ${v(b,'G')}, ${v(b,'B')})`, Py.ORDER_ATOMIC];
f['mn_cor_hsv'] = (b) => [`cor_hsv(${v(b,'H')}, ${v(b,'S')}, ${v(b,'V')})`, Py.ORDER_ATOMIC];
f['mn_cor_arco'] = (b) => [`cor_arco(${v(b,'P')})`, Py.ORDER_ATOMIC];

// Sensor
const sensor = (extra) => { Py.usa.add('sensor'); if (extra) Py.usa.add(extra); };
f['mn_aceleracao'] = (b) => { sensor(); return [`sensor.aceleracao_eixo("${b.getFieldValue('EIXO')}")`, Py.ORDER_ATOMIC]; };
f['mn_giro'] = (b) => { sensor(); return [`sensor.giro_eixo("${b.getFieldValue('EIXO')}")`, Py.ORDER_ATOMIC]; };
f['mn_angulo'] = (b) => { sensor(); return [`sensor.angulo(${b.getFieldValue('TIPO') === 'rol' ? 'True' : 'False'})`, Py.ORDER_ATOMIC]; };
f['mn_inclinada'] = (b) => { sensor(); return [`sensor.inclinacao() == ${b.getFieldValue('DIR')}`, Py.ORDER_REL]; };
f['mn_sacudida'] = () => { sensor('sacudida'); return ['sensor.sacudida()', Py.ORDER_ATOMIC]; };
f['mn_temperatura'] = () => { sensor(); return ['sensor.temperatura()', Py.ORDER_ATOMIC]; };
f['mn_passos'] = () => { sensor('passos'); return ['sensor.passos()', Py.ORDER_ATOMIC]; };
f['mn_zerar_passos'] = () => { sensor('passos'); return 'sensor.zerar_passos()\n'; };
f['mn_sensibilidade'] = (b) => { sensor('sacudida'); return `sensor.sensibilidade(${b.getFieldValue('NIVEL')})\n`; };
f['mn_faixa_acel'] = (b) => { sensor(); return `sensor.faixa_acelerometro(${b.getFieldValue('F')})\n`; };
f['mn_faixa_giro'] = (b) => { sensor(); return `sensor.faixa_giroscopio(${b.getFieldValue('F')})\n`; };
f['mn_conectado'] = () => { sensor(); return ['sensor.conectado', Py.ORDER_ATOMIC]; };
f['mn_nome_sensor'] = () => { sensor(); return ['sensor.nome()', Py.ORDER_ATOMIC]; };

// Monitor serial
f['mn_escrever'] = (b) => `print(${v(b,'V',Py.ORDER_NONE,'""')})\n`;
f['mn_escrever_dois'] = (b) => `print(${v(b,'A',Py.ORDER_NONE,'""')}, ${v(b,'B',Py.ORDER_NONE,'""')})\n`;

/* Monta o programa completo (main.py) a partir da área de blocos. */
function gerarPrograma(ws) {
  Py.init(ws);
  let setup = '', loop = '';
  const soltos = [];
  for (const topo of ws.getTopBlocks(true)) {
    if (!topo.isEnabled()) continue;
    if (topo.type === 'mn_ao_ligar') { const p = topo.getInputTargetBlock('CORPO'); if (p) setup += Py.blockToCode(p); }
    else if (topo.type === 'mn_sempre') loop += Py.statementToCode(topo, 'CORPO');
    else soltos.push(topo);
  }
  const u = Py.usa;
  const L = [];
  L.push('# Programa gerado pelo mannaNAUTA Blocos');
  L.push('# Placa: mannaNAUTA (ESP32-S3) com MicroPython');
  L.push('');
  L.push('import time');
  if (u.has('math')) L.push('import math');
  if (u.has('random')) L.push('import random');
  L.push('from mannanauta import *');
  L.push('');
  if (u.has('matriz')) L.push('matriz = Matriz()');
  if (u.has('sensor')) L.push('sensor = Sensor()');
  if (u.has('passos')) L.push('sensor.ligar_passos()');
  if (u.has('sacudida')) L.push('sensor.sensibilidade(20)');

  const vars = ws.getVariableMap().getAllVariables();
  if (vars.length) { L.push(''); for (const va of vars) L.push(`${Py.nomeVar(va.getId())} = 0`); }

  if (setup) { L.push(''); L.push('# quando a placa ligar'); L.push(setup.replace(/\s+$/, '')); }
  L.push('');
  L.push('# repetir para sempre');
  L.push('while True:');
  L.push(loop ? loop.replace(/\s+$/, '') : Py.INDENT + 'time.sleep_ms(100)');
  if (soltos.length) {
    L.push('');
    L.push(`# Atenção: ${soltos.length} bloco(s) fora de "quando a placa ligar" ou "repetir para sempre" não entraram no programa.`);
  }
  return L.join('\n') + '\n';
}

/* ------------------- Conexão com a placa (MicroPython) --------------- */
// Uma única conexão serial é usada para enviar programas e para o monitor.
const conexao = { porta: null, leitor: null, escritor: null, buffer: '', ouvintes: [] };
const dec = new TextDecoder();
const enc = new TextEncoder();
const esperar = (ms) => new Promise((r) => setTimeout(r, ms));

function noMonitor(texto) {
  const m = $('monitor');
  m.textContent = (m.textContent + texto).slice(-20000);
  m.parentElement.scrollTop = m.parentElement.scrollHeight;
}

async function conectar(portaConhecida = null) {
  if (conexao.porta) return conexao.porta;
  const porta = portaConhecida || await navigator.serial.requestPort();
  await porta.open({ baudRate: 115200 });
  conexao.porta = porta; conexao.ultimaPorta = porta;
  conexao.escritor = porta.writable.getWriter();
  conexao.leitor = porta.readable.getReader();
  $('btConectar').textContent = 'Desconectar';
  status('Placa conectada');
  (async () => {
    try {
      while (true) {
        const { value, done } = await conexao.leitor.read();
        if (done) break;
        const t = dec.decode(value, { stream: true });
        conexao.buffer += t;
        if (conexao.buffer.length > 200000) conexao.buffer = conexao.buffer.slice(-100000);
        if (!conexao.silencio) noMonitor(t);
      }
    } catch (e) { /* porta fechada */ }
    await desconectar(true);
  })();
  return porta;
}

async function desconectar(jaFechando = false) {
  const c = conexao;
  if (!c.porta) return;
  const porta = c.porta; c.porta = null;
  try { if (!jaFechando && c.leitor) await c.leitor.cancel(); } catch (e) {}
  try { c.leitor && c.leitor.releaseLock(); } catch (e) {}
  try { c.escritor && c.escritor.releaseLock(); } catch (e) {}
  try { await porta.close(); } catch (e) {}
  c.leitor = null; c.escritor = null;
  $('btConectar').textContent = 'Conectar placa';
  status('Placa desconectada');
}

async function escrever(texto) {
  const dados = typeof texto === 'string' ? enc.encode(texto) : texto;
  // envia em pedaços pequenos para não sobrecarregar a placa
  for (let i = 0; i < dados.length; i += 128) {
    await conexao.escritor.write(dados.slice(i, i + 128));
    await esperar(4);
  }
}

// Espera até aparecer "fim" no que a placa respondeu depois da posição "desde".
async function aguardar(fim, desde, tempo = 5000) {
  const limite = Date.now() + tempo;
  while (Date.now() < limite) {
    const i = conexao.buffer.indexOf(fim, desde);
    if (i >= 0) return i + fim.length;
    await esperar(20);
  }
  throw new Error('A placa não respondeu. Confira o cabo e se o MicroPython está instalado.');
}

// Entra no modo "raw REPL" do MicroPython
async function entrarRaw() {
  await escrever('\r\x03\x03');
  await esperar(150);
  const desde = conexao.buffer.length;
  await escrever('\x01');
  await aguardar('raw REPL; CTRL-B to exit\r\n>', desde, 3000);
}

// Executa um trecho de código no modo raw e devolve [saída, erro]
async function executar(codigo, tempo = 8000) {
  const desde = conexao.buffer.length;
  await escrever(codigo);
  await escrever('\x04');
  const ok = await aguardar('OK', desde, tempo);
  const fimSaida = await aguardar('\x04', ok, tempo);
  const fimErro = await aguardar('\x04>', fimSaida, tempo);
  const saida = conexao.buffer.slice(ok, fimSaida - 1);
  const erro = conexao.buffer.slice(fimSaida, fimErro - 2);
  return [saida, erro];
}

function paraBase64(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}

async function gravarArquivo(nome, conteudo) {
  const bytes = enc.encode(conteudo);
  let [, erro] = await executar(`import ubinascii as _b\n_f=open(${JSON.stringify(nome)},'wb')`);
  if (erro) throw new Error(erro);
  for (let i = 0; i < bytes.length; i += 384) {
    [, erro] = await executar(`_f.write(_b.a2b_base64('${paraBase64(bytes.slice(i, i + 384))}'))`);
    if (erro) throw new Error(erro);
    progresso(Math.min(0.95, (i + 384) / bytes.length));
  }
  [, erro] = await executar('_f.close()');
  if (erro) throw new Error(erro);
}

let bibliotecaTexto = null;
async function carregarBiblioteca() {
  if (bibliotecaTexto) return bibliotecaTexto;
  const r = await fetch('micropython/mannanauta.py', { cache: 'no-cache' });
  if (!r.ok) throw new Error('Não encontrei o arquivo micropython/mannanauta.py');
  bibliotecaTexto = await r.text();
  return bibliotecaTexto;
}

// Confere se a placa responde como MicroPython (sem mexer no programa dela).
async function temMicroPython() {
  conexao.silencio = true;
  try {
    await escrever('\r\x03\x03');
    await esperar(200);
    const desde = conexao.buffer.length;
    await escrever('\x01');
    await aguardar('raw REPL; CTRL-B to exit', desde, 2500);
    // volta ao normal e reinicia, para o programa da placa continuar rodando
    await escrever('\x02');
    await esperar(100);
    await escrever('\x04');
    return true;
  } catch (e) {
    return false;
  } finally { conexao.silencio = false; }
}

let verificando = false;
// Chamado sempre que a placa é conectada: se não tiver MicroPython, oferece a instalação.
async function aoConectar(automatico) {
  if (verificando) return;
  verificando = true;
  try {
    status('Verificando a placa…');
    if (await temMicroPython()) {
      status(automatico ? 'Placa conectada automaticamente ✔' : 'Placa conectada ✔');
    } else {
      status('Esta placa ainda não tem o MicroPython');
      pedirInstalacao(true);
    }
  } finally { verificando = false; }
}

function pedirInstalacao(semMicroPython) {
  $('txtInstalar').textContent = semMicroPython
    ? 'Esta placa ainda não tem o MicroPython, que é necessário para receber os programas. Instalar agora? Leva cerca de 1 minuto e apaga o que estiver gravado na placa.'
    : 'Faça isso só se a placa for nova ou parar de responder. Tudo o que estiver gravado nela será apagado.';
  if (!$('dlgInstalar').open) $('dlgInstalar').showModal();
}

// Conexão automática: quando uma placa já usada antes neste computador é ligada no cabo.
async function conectarAutomatico() {
  if (!temSerial || emQuadro || conexao.porta || instalando) return;
  try {
    const portas = await navigator.serial.getPorts();
    if (portas.length !== 1) return;
    await conectar(portas[0]);
    await aoConectar(true);
  } catch (e) { /* placa ocupada ou desligada: segue sem conectar */ }
}
if (temSerial && !emQuadro) {
  navigator.serial.addEventListener('connect', () => setTimeout(conectarAutomatico, 800));
  navigator.serial.addEventListener('disconnect', (e) => { if (conexao.porta && e.target === conexao.porta) desconectar(true); });
  setTimeout(conectarAutomatico, 500);
}

    else { await conectar(); document.querySelector('.abas button[data-aba="monitor"]').click(); await aoConectar(false); }
  } catch (e) { if (!(e && e.name === 'NotFoundError')) status('Não foi possível conectar'); }

$('btEnviar').onclick = async () => {
  const bt = $('btEnviar');
  if (!temSerial || emQuadro) { status('Envio indisponível aqui (veja o aviso)'); return; }
  bt.disabled = true; progresso(0.03);
  try {
    await conectar();
    conexao.silencio = true;
    status('Preparando a placa…');
    try { await entrarRaw(); }
    catch (e) {
      conexao.silencio = false; progresso(0);
      status('Esta placa ainda não tem o MicroPython');
      pedirInstalacao(true);
      return;
    }
    // Confere se a biblioteca mannanauta.py já está na placa e atualizada
    const lib = await carregarBiblioteca();
    const versao = (lib.match(/^VERSAO = "([^"]+)"/m) || [])[1] || '?';
    const [saida] = await executar(
      `try:\n import os\n f=open('mannanauta.py')\n l=f.readline()\n while l and not l.startswith('VERSAO'):\n  l=f.readline()\n f.close()\n print(l.strip())\nexcept Exception:\n print('nada')`);
    if (!saida.includes(`VERSAO = "${versao}"`)) {
      status('Instalando a biblioteca mannanauta na placa…');
      await gravarArquivo('mannanauta.py', lib);
    }
    status('Enviando o programa…');
    await gravarArquivo('main.py', codigoAtual);
    progresso(1);
    // Sai do modo raw e reinicia: o main.py começa a rodar
    await escrever('\x02');
    await esperar(100);
    conexao.silencio = false;
    noMonitor('\n--- programa enviado, reiniciando a placa ---\n');
    await escrever('\x04');
    status('Programa enviado! ✔');
    document.querySelector('.abas button[data-aba="monitor"]').click();
    setTimeout(() => progresso(0), 1500);
  } catch (e) {
    conexao.silencio = false;
    progresso(0);
    if (e && e.name === 'NotFoundError') status('Nenhuma porta escolhida');
    else { status('Falha no envio'); mostrarErro((e && e.message) || String(e)); }
    try { if (conexao.porta) await escrever('\x02'); } catch (e2) {}
  } finally { bt.disabled = false; }
};

$('btParar').onclick = async () => {
  if (!conexao.porta) { status('Conecte a placa primeiro'); return; }
  await escrever('\x03');
  status('Programa parado');
};

function mostrarErro(texto) {
  document.querySelector('.abas button[data-aba="monitor"]').click();
  noMonitor('\n⚠ ' + texto + '\n');
}
$('btLimparMonitor').onclick = () => { $('monitor').textContent = ''; };

/* ------------------ Instalar o MicroPython na placa ------------------ */
let esptool = null;
async function carregarEsptool() {
  if (!esptool) esptool = await import('https://unpkg.com/esptool-js@0.7.1/bundle.js');
  return esptool;
}

let instalando = false;
$('btInstalar').onclick = () => pedirInstalacao(false);
$('btCancelarInst').onclick = () => $('dlgInstalar').close();
$('btConfirmarInst').onclick = async () => {
  $('dlgInstalar').close();
  if (!temSerial || emQuadro) { status('Instalação indisponível aqui (veja o aviso)'); return; }
  const bt = $('btInstalar');
  bt.disabled = true; $('btEnviar').disabled = true;
  let transporte = null;
  instalando = true;
  try {
    const conhecida = conexao.porta || null;
    await desconectar();
    const porta = conhecida || await navigator.serial.requestPort();
    status('Conectando à placa…'); progresso(0.02);
    const { ESPLoader, Transport } = await carregarEsptool();
    transporte = new Transport(porta, false);
    const terminal = { clean() {}, writeLine(t) { console.log(t); }, write(t) {} };
    const carregador = new ESPLoader({ transport: transporte, baudrate: 460800, terminal, romBaudrate: 115200 });
    const chip = await carregador.main();
    if (!/ESP32-S3/i.test(chip)) throw new Error('Esta placa não parece ser um ESP32-S3 (' + chip + ').');
    let tamanho = '';
    try { tamanho = (await carregador.detectFlashSize()) || ''; } catch (e) {}
    const arquivo = /^(2|4)MB/.test(tamanho) ? 'firmware/ESP32_GENERIC_S3-FLASH_4M.bin' : 'firmware/ESP32_GENERIC_S3.bin';
    status('Baixando o MicroPython…');
    const r = await fetch(arquivo, { cache: 'no-cache' });
    if (!r.ok) throw new Error('Não encontrei o arquivo ' + arquivo);
    const dados = new Uint8Array(await r.arrayBuffer());
    status('Gravando o MicroPython (cerca de 1 minuto)…');
    await carregador.writeFlash({
      fileArray: [{ address: 0x0, data: dados }], flashSize: 'keep', flashMode: 'keep', flashFreq: 'keep',
      eraseAll: true, compress: true,
      reportProgress: (i, escrito, total) => progresso(0.05 + 0.95 * escrito / total)
    });
    try { await carregador.after('hard_reset'); } catch (e) {}
    status('MicroPython instalado! ✔ Reconectando…');
    setTimeout(async () => {
      instalando = false;
      await conectarAutomatico();
      if (!conexao.porta) status('MicroPython instalado! ✔ Clique em "Conectar placa" e escolha a porta de novo.');
    }, 3000);
    progresso(1); setTimeout(() => progresso(0), 2000);
  } catch (e) {
    progresso(0);
    if (e && e.name === 'NotFoundError') status('Nenhuma porta escolhida');
    else { status('Falha na instalação'); mostrarErro(((e && e.message) || String(e)) + '\nDica: segure o botão BOOT, aperte e solte RESET, solte o BOOT e tente de novo.'); }
  } finally {
    try { if (transporte) await transporte.disconnect(); } catch (e) {}
    bt.disabled = false; $('btEnviar').disabled = false;
    setTimeout(() => { instalando = false; }, 3500);
  }
};
</script>
